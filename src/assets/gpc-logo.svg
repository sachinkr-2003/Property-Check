<svg width="150" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2196F3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF9800;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="30" cy="30" r="25" fill="url(#textGradient)" opacity="0.1"/>
  
  <!-- Main text GPC -->
  <text x="75" y="40" font-family="Arial, sans-serif" font-size="32" font-weight="bold" 
        text-anchor="middle" fill="url(#textGradient)" filter="url(#shadow)">GPC</text>
  
  <!-- Subtitle -->
  <text x="75" y="52" font-family="Arial, sans-serif" font-size="8" font-weight="normal" 
        text-anchor="middle" fill="#ffffff" opacity="0.8">Property Check</text>
</svg>